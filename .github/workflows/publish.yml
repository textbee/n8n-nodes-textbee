# Releasing is driven by the version field in package.json.
#
# Bump "version", merge it to main, and this publishes it. The pull request
# carrying the bump is the release proposal: reviewing and merging it is the
# approval step.
#
# The guard compares package.json against the git tags, so the workflow is
# idempotent. Pushes that do not change the version are a no-op, and a failed
# release can be retried by pushing again or running the workflow by hand.
#
# The npm Trusted Publisher for this package points at this file name
# (publish.yml). Renaming it breaks publishing.
name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

# Never let two releases run at once, and never cancel one midway: an
# interrupted run can leave a version on npm with no tag behind it.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    name: Check for an unreleased version
    # Manual runs can pick any branch. Only main is ever released.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      name: ${{ steps.check.outputs.name }}
      version: ${{ steps.check.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
      on_npm: ${{ steps.check.outputs.on_npm }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags are the record of what has shipped, so fetch all of them.
          fetch-depth: 0
          persist-credentials: false

      - name: Compare package.json version against tags and npm
        id: check
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "v$version is already tagged, nothing to release."
            exit 0
          fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"

          # npm view is a read-only registry lookup. It and npm publish below
          # are the only npm commands, because npm is the CLI that performs
          # the trusted-publishing OIDC exchange. Everything else uses pnpm.
          #
          # A version published by hand (the first one, since npm Trusted
          # Publishing cannot create a package) only needs its tag.
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "on_npm=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version is on npm but untagged, tagging only."
          else
            echo "on_npm=false" >> "$GITHUB_OUTPUT"
            echo "v$version has no tag yet, releasing."
          fi

  build:
    name: Build and pack
    needs: check
    if: needs.check.outputs.should_release == 'true' && needs.check.outputs.on_npm == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      # No dependency cache in the release path.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Unit test
        run: pnpm test

      - name: Pack
        run: pnpm pack

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: '*.tgz'
          if-no-files-found: error
          retention-days: 7

  # Only this job can mint the OIDC token, and it runs no project code: it
  # publishes the tarball the build job produced.
  publish:
    name: Publish v${{ needs.check.outputs.version }} to npm
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Minting the OIDC token npm exchanges for a publish credential.
      id-token: write

    steps:
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      # Trusted publishing needs npm 11.5.1 or later. Node 24 ships it.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # npm publish runs before tagging on purpose. If it fails there is no tag,
      # so the next push retries cleanly.
      #
      # No NODE_AUTH_TOKEN: the OIDC exchange authenticates this publish and
      # attaches a provenance attestation automatically.
      - name: Publish to npm
        env:
          # The prepublishOnly guard from @n8n/node-cli blocks a bare publish.
          RELEASE_MODE: 'true'
        run: |
          npm --version
          npm publish ./*.tgz --access public

  github-release:
    name: Tag and create the GitHub release
    needs: [check, publish]
    # Runs after a CI publish, or on its own for a version published by hand.
    if: >-
      always() &&
      needs.check.outputs.should_release == 'true' &&
      (needs.publish.result == 'success' ||
       (needs.publish.result == 'skipped' && needs.check.outputs.on_npm == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Creating the tag and the GitHub release.
      contents: write

    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --target "$GITHUB_SHA" \
            --generate-notes
